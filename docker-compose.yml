services:
  postgres:
    image: postgres:16
    container_name: personalfinance-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: personalfinance
      # Trust auth (no password) to match the no-password local dev setup
      # this replaces. Fine for local dev only - never use in production.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - personalfinance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Logs, traces and metrics from the API (#121): open http://localhost:18888.
  # Point the API at it with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317.
  # In-memory only - telemetry is gone when the container stops.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    container_name: personalfinance-dashboard
    environment:
      # Local dev only: no login on the dashboard UI or the OTLP endpoint.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"   # UI
      - "4317:18889"    # OTLP/gRPC in

volumes:
  personalfinance-postgres-data:
