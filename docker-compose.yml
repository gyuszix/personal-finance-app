# Local stack (#122):  cp .env.example .env  (fill in Plaid sandbox keys)  &&  docker compose up --build
#   API        http://localhost:5140   (API docs at /scalar/v1)
#   Dashboard  http://localhost:18888  (logs, traces, metrics)
# Just the database, for `dotnet run` instead:  docker compose up -d postgres
services:
  postgres:
    image: postgres:16
    container_name: personalfinance-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: personalfinance
      # Trust auth (no password) to match the no-password local dev setup
      # this replaces. Fine for local dev only - never use in production.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - personalfinance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # (GSS Encryption Mode=Disable: no Kerberos here, and the slim image has
  # no libgssapi for Npgsql to probe.)
  # One-shot: migrations as the schema owner, and pf_app's login. The API
  # waits for it to finish successfully.
  migrate:
    build: .
    image: personalfinance-api:local
    pull_policy: build
    command: ["migrate"]
    environment:
      ConnectionStrings__Migrations: "Host=postgres;Database=personalfinance;Username=postgres;GSS Encryption Mode=Disable"
      Database__AppRolePassword: ${DATABASE_APP_ROLE_PASSWORD:?set it in .env}
      # Required by startup even though migrate doesn't use them.
      Encryption__CurrentKeyId: ${ENCRYPTION_CURRENT_KEY_ID:-k1}
      Encryption__Keys__k1: ${ENCRYPTION_KEY_K1:?set it in .env (scripts/new-kek.sh)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    # Built by the migrate service (same image).
    image: personalfinance-api:local
    pull_policy: never
    environment:
      # Development: readable logs and the Scalar API docs. The image itself
      # defaults to Production.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Database=personalfinance;Username=pf_app;Password=${DATABASE_APP_ROLE_PASSWORD};GSS Encryption Mode=Disable"
      Jwt__Key: ${JWT_KEY:?set it in .env}
      Jwt__Issuer: PersonalFinance.Api
      Jwt__Audience: PersonalFinance.Api
      Plaid__ClientId: ${PLAID_CLIENT_ID:?set it in .env}
      Plaid__Secret: ${PLAID_SECRET:?set it in .env}
      Plaid__Environment: sandbox
      Encryption__CurrentKeyId: ${ENCRYPTION_CURRENT_KEY_ID:-k1}
      Encryption__Keys__k1: ${ENCRYPTION_KEY_K1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    ports:
      - "5140:8080"
    volumes:
      - personalfinance-api-keys:/var/lib/personalfinance/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
      aspire-dashboard:
        condition: service_started
    restart: unless-stopped

  # Logs, traces and metrics from the API (#121): open http://localhost:18888.
  # For an API run with `dotnet run`, use OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317.
  # In-memory only - telemetry is gone when the container stops.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    container_name: personalfinance-dashboard
    environment:
      # Local dev only: no login on the dashboard UI or the OTLP endpoint.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"   # UI
      - "4317:18889"    # OTLP/gRPC in

volumes:
  personalfinance-postgres-data:
  personalfinance-api-keys:
